name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.11
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked python tests/smoke.py
      - run: uv build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: presentation/package-lock.json
      - run: npm ci --prefix presentation
      - run: npm run typecheck --prefix presentation
      - run: npm run build --prefix presentation
      - run: npm run build:single --prefix presentation
      - name: Stage standalone presentation
        run: cp presentation/dist-single/index.html dist/loopguard-presentation.html
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz loopguard-presentation.html > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
