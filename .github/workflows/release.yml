name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tests/smoke.py
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          tar -czf "dist/loopguard-$TARGET.tar.gz" -C "target/$TARGET/release" loopguard
          cd dist
          shasum -a 256 "loopguard-$TARGET.tar.gz" > "loopguard-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: loopguard-${{ matrix.target }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: loopguard-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
